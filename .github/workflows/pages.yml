name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # lets you re-deploy by hand from the Actions tab without pushing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish; queue at most one more
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # regenerates blog.html and blog/**.html from posts/*.md, so the
      # published site can never fall behind the Markdown sources
      - name: Build blog
        run: node scripts/build-blog.js

      - name: Fail if the committed blog output was stale
        run: |
          if ! git diff --quiet; then
            echo "::warning::Committed blog HTML differed from a fresh build; publishing the fresh build."
            git diff --stat
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
