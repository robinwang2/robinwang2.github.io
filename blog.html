<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="这里会放我关于游戏、技术、创作和现实议题的文章。">
    <title>博客 | Sanxing Wang</title>
    <link rel="stylesheet" href="css/styles.css?v=20260625-blog-css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="project-page-body blog-page-body">
    <header class="project-page-header blog-site-header">
        <nav class="project-nav">
            <a class="project-back-link" href="index.html">主页</a>
            <a href="#" id="language-toggle" class="project-language-toggle">EN</a>
        </nav>
    </header>
    <main class="blog-page">
        <section class="blog-hero">
            <p class="blog-kicker">Sanxing Wang</p>
            <h1 id="blog-title">博客</h1>
            <p id="blog-intro">这里会放我关于游戏、技术、创作和现实议题的文章。</p>
        </section>
        <section class="blog-toolbar" aria-label="Blog filters">
            <div class="blog-filter-group">
                <span id="category-label">分类</span>
                <div class="blog-filter-options" id="category-filters"></div>
            </div>
            <div class="blog-filter-group">
                <span id="tag-label">标签</span>
                <div class="blog-filter-options" id="tag-filters"></div>
            </div>
        </section>
        <section class="blog-list" id="blog-list" aria-live="polite"></section>
    </main>
    <script>
    (() => {
      const storageKey = 'site-language';
      const copy = {"zh":{"label":"中文","htmlLang":"zh-Hans","listTitle":"博客","listIntro":"这里会放我关于游戏、技术、创作和现实议题的文章。","allLabel":"全部","categoryLabel":"分类","tagLabel":"标签","emptyLabel":"还没有发布文章。","readMore":"阅读全文","backToBlog":"返回博客","switchLabel":"EN","homeLabel":"主页","dateLocale":"zh-CN"},"en":{"label":"English","htmlLang":"en","listTitle":"Blog","listIntro":"Notes on games, technology, creative work, and the world around them.","allLabel":"All","categoryLabel":"Category","tagLabel":"Tag","emptyLabel":"No posts published yet.","readMore":"Read article","backToBlog":"Back to Blog","switchLabel":"中文","homeLabel":"Home","dateLocale":"en-US"}};
      const posts = [{"lang":"zh","slug":"2026-06-25-star-citizen-emptiness","title":"游戏批评：《星际公民》的空虚感","date":"2026-06-25","displayDate":"2026年6月25日","category":"游戏批评","tags":["星际公民","游戏设计","MMO","太空游戏","行业观察"],"summary":"从信息设计、付费模式、删档风险、独狼体验和多人船人效问题切入，讨论《星际公民》为什么会在宏伟宇宙中制造一种空虚感。","href":"blog/2026-06-25-star-citizen-emptiness.html"},{"lang":"zh","slug":"2026-06-25-welcome","title":"欢迎来到我的博客","date":"2026-06-25","displayDate":"2026年6月25日","category":"随笔","tags":["创作","游戏设计","AI"],"summary":"这是博客系统的第一篇文章，用来确认 Markdown、分类、标签和中英双语页面都能正常生成。","href":"blog/2026-06-25-welcome.html"},{"lang":"en","slug":"2026-06-25-star-citizen-emptiness","title":"Game Criticism: The Emptiness of Star Citizen","date":"2026-06-25","displayDate":"June 25, 2026","category":"Game Criticism","tags":["Star Citizen","Game Design","MMO","Space Games","Industry Commentary"],"summary":"A critique of how Star Citizen's information design, monetization, wipes, solo experience, and multicrew ship balance create a sense of emptiness inside an otherwise impressive universe.","href":"blog/en/2026-06-25-star-citizen-emptiness.html"},{"lang":"en","slug":"2026-06-25-welcome","title":"Welcome to My Blog","date":"2026-06-25","displayDate":"June 25, 2026","category":"Notes","tags":["Creative Work","Game Design","AI"],"summary":"This first post checks that Markdown, categories, tags, and bilingual pages are all generated correctly.","href":"blog/en/2026-06-25-welcome.html"}];
      let currentLang = localStorage.getItem(storageKey) === 'en' ? 'en' : 'zh';
      let activeCategory = 'all';
      let activeTag = 'all';

      const escapeHtml = (value) => String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);

      const getLangPosts = () => posts.filter((post) => post.lang === currentLang);

      const renderButtons = (target, values, activeValue, onClick) => {
        target.replaceChildren();
        const allButton = document.createElement('button');
        allButton.type = 'button';
        allButton.textContent = copy[currentLang].allLabel;
        allButton.className = activeValue === 'all' ? 'active' : '';
        allButton.addEventListener('click', () => onClick('all'));
        target.append(allButton);

        values.forEach((value) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = value;
          button.className = activeValue === value ? 'active' : '';
          button.addEventListener('click', () => onClick(value));
          target.append(button);
        });
      };

      const render = () => {
        const langCopy = copy[currentLang];
        document.documentElement.lang = langCopy.htmlLang;
        document.title = langCopy.listTitle + ' | Sanxing Wang';
        document.getElementById('blog-title').textContent = langCopy.listTitle;
        document.getElementById('blog-intro').textContent = langCopy.listIntro;
        document.getElementById('category-label').textContent = langCopy.categoryLabel;
        document.getElementById('tag-label').textContent = langCopy.tagLabel;
        document.getElementById('language-toggle').textContent = langCopy.switchLabel;
        document.querySelector('.project-back-link').textContent = langCopy.homeLabel;

        const langPosts = getLangPosts();
        const categories = [...new Set(langPosts.map((post) => post.category).filter(Boolean))];
        const tags = [...new Set(langPosts.flatMap((post) => post.tags))];

        if (!categories.includes(activeCategory)) activeCategory = 'all';
        if (!tags.includes(activeTag)) activeTag = 'all';

        renderButtons(document.getElementById('category-filters'), categories, activeCategory, (value) => {
          activeCategory = value;
          render();
        });

        renderButtons(document.getElementById('tag-filters'), tags, activeTag, (value) => {
          activeTag = value;
          render();
        });

        const visiblePosts = langPosts.filter((post) => {
          const categoryMatches = activeCategory === 'all' || post.category === activeCategory;
          const tagMatches = activeTag === 'all' || post.tags.includes(activeTag);
          return categoryMatches && tagMatches;
        });

        const list = document.getElementById('blog-list');
        if (!visiblePosts.length) {
          list.innerHTML = '<p class="blog-empty">' + escapeHtml(langCopy.emptyLabel) + '</p>';
          return;
        }

        list.innerHTML = visiblePosts.map((post) => {
          const tagsHtml = post.tags.map((tag) => '<span class="blog-tag">' + escapeHtml(tag) + '</span>').join('');
          return '<article class="blog-list-item">' +
            '<div class="blog-card-meta"><time datetime="' + escapeHtml(post.date) + '">' + escapeHtml(post.displayDate) + '</time>' +
            (post.category ? '<span>' + escapeHtml(post.category) + '</span>' : '') + '</div>' +
            '<h2><a href="' + escapeHtml(post.href) + '">' + escapeHtml(post.title) + '</a></h2>' +
            '<p>' + escapeHtml(post.summary) + '</p>' +
            '<div class="blog-tags">' + tagsHtml + '</div>' +
            '<a class="blog-read-link" href="' + escapeHtml(post.href) + '">' + escapeHtml(langCopy.readMore) + '</a>' +
          '</article>';
        }).join('');
      };

      document.getElementById('language-toggle').addEventListener('click', (event) => {
        event.preventDefault();
        currentLang = currentLang === 'zh' ? 'en' : 'zh';
        localStorage.setItem(storageKey, currentLang === 'en' ? 'en' : 'zh-Hans');
        activeCategory = 'all';
        activeTag = 'all';
        render();
      });

      render();
    })();
    </script>
</body>
</html>
